name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install i.p.v. npm ci: er is nog geen package-lock.json in de repo.
      # Na een lokale `npm install` + commit van package-lock.json kan dit
      # terug naar `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
